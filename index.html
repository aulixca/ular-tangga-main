<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan Ular Tangga PAI - 3 Pemain</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .header-box {
      background: #ffffff;
      padding: 12px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 0px #4a90e2, 0 12px 20px rgba(0,0,0,0.15);
      text-align: center;
      margin-bottom: 15px;
      border: 4px solid #4a90e2;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #ff4757;
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0px #ffa502;
    }

    p.subtitle {
      color: #2ed573;
      font-weight: 900;
      margin: 3px 0 0 0;
      font-size: 14px;
    }

    /* Layout Utama */
    #main-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      max-width: 1100px;
      width: 100%;
    }

    /* Papan Permainan */
    #board-wrapper {
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 10px 0px #2ed573, 0 15px 25px rgba(0,0,0,0.1);
      border: 4px solid #2ed573;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      width: 100%;
      max-width: 460px;
      height: 460px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #ced6e0;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 10px;
      position: relative;
      border: 1px dashed rgba(0, 0, 0, 0.08);
      font-family: 'Fredoka One', cursive;
    }

    /* Warna Sel Papan */
    .cell-c1 { background-color: #ff7675; color: white; }
    .cell-c2 { background-color: #74b9ff; color: white; }
    .cell-c3 { background-color: #55efc4; color: #2d3436; }
    .cell-c4 { background-color: #ffeaa7; color: #d63031; }

    /* Bidak Multi-Pemain */
    .player-tokens-container {
      position: absolute;
      display: flex;
      gap: 2px;
      z-index: 10;
    }

    .player-token {
      width: 22px;
      height: 22px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      animation: bounce 0.6s infinite alternate;
    }

    .token-p1 { background: #fffa65; }
    .token-p2 { background: #ffaf40; }
    .token-p3 { background: #ff4d4d; }

    /* Panel Kontrol & Turn Indicator */
    #controls {
      background: #ffffff;
      padding: 18px;
      border-radius: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 0px #ffa502, 0 15px 25px rgba(0,0,0,0.1);
      border: 4px solid #ffa502;
      text-align: center;
    }

    .turn-card {
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: white;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
    }

    .turn-p1 { background: #e1b12c; }
    .turn-p2 { background: #e67e22; }
    .turn-p3 { background: #e74c3c; }

    #dice-box {
      width: 65px;
      height: 65px;
      background: #f1f2f6;
      border: 4px solid #70a1ff;
      border-radius: 15px;
      margin: 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      color: #1e90ff;
    }

    .btn-action {
      background: #2ed573;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'Fredoka One', cursive;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #26af5f;
      transition: all 0.1s ease;
      width: 100%;
    }

    .btn-action:disabled {
      background: #cbd5e1;
      box-shadow: 0 5px 0 #94a3b8;
      cursor: not-allowed;
    }

    /* Papan Skor 3 Pemain */
    .scoreboard {
      background: #f8efba;
      border-radius: 12px;
      padding: 10px;
      margin-top: 12px;
      text-align: left;
      border: 2px solid #f7b731;
      font-size: 12px;
      font-weight: 800;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      border-radius: 8px;
      margin: 4px 0;
      background: white;
      border: 1px solid #ddd;
    }

    .active-row {
      border: 2px solid #2ed573;
      background: #e8f8f5;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(47, 53, 66, 0.75);
      justify-content: center;
      align-items: center;
      padding: 15px;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      border: 5px solid #70a1ff;
      box-shadow: 0 10px 0 #1e90ff;
    }

    .input-group {
      margin: 12px 0;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: 900;
      margin-bottom: 5px;
      color: #2f3542;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 2px solid #70a1ff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      outline: none;
    }

    .question-badge {
      background: #ff7675;
      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-family: 'Fredoka One', cursive;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 8px;
    }

    #question-text {
      font-size: 15px;
      font-weight: 800;
      color: #2f3542;
      margin-bottom: 12px;
    }

    .option-btn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px 12px;
      text-align: left;
      background: #f1f2f6;
      border: 2px solid #dfe4ea;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
    }

    .option-btn:hover {
      background: #ffeaa7;
      border-color: #fdcb6e;
    }

    #feedback {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      text-align: center;
    }

    .fb-correct { background: #d4edda; color: #155724; }
    .fb-wrong { background: #f8d7da; color: #721c24; }

    /* Footer Pembuat Aplikasi */
    footer {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #2f3542;
      text-align: center;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>Petualangan Ular Tangga PAI</h1>
    <p class="subtitle">Mode Seru: 3 Pemain Bergantian</p>
  </div>

  <div id="main-container">
    <div id="board-wrapper">
      <div id="board"></div>
    </div>

    <div id="controls">
      <div id="turn-banner" class="turn-card turn-p1">
        Giliran: Pemain 1 🐥
      </div>

      <div id="dice-box">🎲</div>
      <button id="roll-btn" class="btn-action" onclick="rollDice()">KOCOK DADU!</button>

      <!-- Skoring 3 Pemain -->
      <div class="scoreboard">
        <div id="row-p1" class="player-row active-row">
          <span id="label-p1">🐥 Pemain 1</span>
          <span>Kotak: <b id="pos-p1">1</b> | Skor: <b id="score-p1">0%</b></span>
        </div>
        <div id="row-p2" class="player-row">
          <span id="label-p2">🦊 Pemain 2</span>
          <span>Kotak: <b id="pos-p2">1</b> | Skor: <b id="score-p2">0%</b></span>
        </div>
        <div id="row-p3" class="player-row">
          <span id="label-p3">🐰 Pemain 3</span>
          <span>Kotak: <b id="pos-p3">1</b> | Skor: <b id="score-p3">0%</b></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Keterangan Pembuat -->
  <footer>
    created by uzmila_sdn01karangasem
  </footer>

  <!-- Modal Input Nama Pemain (Muncul Saat Awal Mulai) -->
  <div id="name-modal" class="modal" style="display: flex;">
    <div class="modal-content">
      <h2 style="font-family: 'Fredoka One', cursive; color: #ff4757; margin-top: 0; text-align: center;">Selamat Datang!</h2>
      <p style="font-weight: 800; color: #57606f; text-align: center; font-size: 14px;">Masukkan Nama-Nama Anak Yang Akan Bermain:</p>
      
      <div class="input-group">
        <label>🐥 Pemain 1 (Kuning):</label>
        <input type="text" id="input-p1" placeholder="Masukkan Nama Pemain 1" value="Anak 1">
      </div>
      <div class="input-group">
        <label>🦊 Pemain 2 (Oranye):</label>
        <input type="text" id="input-p2" placeholder="Masukkan Nama Pemain 2" value="Anak 2">
      </div>
      <div class="input-group">
        <label>🐰 Pemain 3 (Merah):</label>
        <input type="text" id="input-p3" placeholder="Masukkan Nama Pemain 3" value="Anak 3">
      </div>

      <button class="btn-action" style="margin-top: 15px;" onclick="startGame()">MULAI PERMAINAN! 🚀</button>
    </div>
  </div>

  <!-- Modal Soal -->
  <div id="quiz-modal" class="modal">
    <div class="modal-content">
      <span class="question-badge" id="modal-player-tag">Tantangan PAI</span>
      <p id="question-text"></p>
      <div id="options-container"></div>
      
      <div id="feedback"></div>
      <button id="next-btn" class="btn-action" style="display: none; margin-top: 12px;" onclick="closeModal()">Lanjut Main! 🚀</button>
    </div>
  </div>

  <script>
    // Database Soal
    const questions = [
      { q: "Surah Al-Hujurāt ayat 13 menjelaskan bahwa Allah menciptakan manusia berbangsa-bangsa agar...", options: ["A. Saling bersaing", "B. Saling mengenal", "C. Saling membenci", "D. Saling menguasai"], ans: "B" },
      { q: "Ukuran kemuliaan seseorang di sisi Allah Swt. ditentukan oleh...", options: ["A. Kekayaannya", "B. Ketakwaannya", "C. Keturunannya", "D. Ketampanannya"], ans: "B" },
      { q: "Membaca Al-Qur'an dengan memperhatikan tajwid dan makhraj dinamakan membaca secara...", options: ["A. Cepat", "B. Tartil", "C. Keras", "D. Nyaring"], ans: "B" },
      { q: "Asmaulhusna Al-Malik artinya Allah Maha...", options: ["A. Mulia", "B. Suci", "C. Raja / Penguasa", "D. Sejahtera"], ans: "C" },
      { q: "Asmaulhusna Al-Quddūs artinya Allah Maha...", options: ["A. Suci", "B. Pengasih", "C. Adil", "D. Memelihara"], ans: "A" },
      { q: "Asmaulhusna As-Salām mengajarkan kita untuk selalu menyebarkan...", options: ["A. Kebencian", "B. Kedamaian", "C. Perselisihan", "D. Permusuhan"], ans: "B" },
      { q: "Perilaku tidak mengandalkan orang lain untuk urusan pribadi dinamakan...", options: ["A. Menahan diri", "B. Mandiri", "C. Pasrah", "D. Tertib"], ans: "B" },
      { q: "Menjaga kebersihan badan dan hati merupakan cerminan Asmaulhusna...", options: ["A. Al-Quddūs", "B. Al-Malik", "C. As-Salām", "D. Al-Mu'min"], ans: "A" },
      { q: "Keragaman suku dan bangsa di dunia merupakan ketetapan Allah yang disebut...", options: ["A. Takdir buruk", "B. Sunnatullah", "C. Kebetulan", "D. Musibah"], ans: "B" },
      { q: "Sikap saling menghargai dan menghormati perbedaan agama dinamakan...", options: ["A. Toleransi", "B. Egoisme", "C. Fanatisme", "D. Akulturasi"], ans: "A" },
      { q: "Tanda balig menurut fikih bagi anak laki-laki dan perempuan adalah...", options: ["A. Haid", "B. Mimpi basah", "C. Suara membesar", "D. Tumbuh kumis"], ans: "B" },
      { q: "Anak perempuan yang sudah mengalami haid menandakan ia telah...", options: ["A. Balig", "B. Tua", "C. Balita", "D. Sakit"], ans: "A" },
      { q: "Anak yang sudah balig dan wajib menjalankan syariat Islam disebut...", options: ["A. Mukalaf", "B. Muallaf", "C. Musafir", "D. Munafik"], ans: "A" },
      { q: "Peristiwa perpindahan Nabi Muhammad saw. dari Makkah ke Madinah disebut...", options: ["A. Isra Miraj", "B. Hijrah", "C. Fathu Makkah", "D. Muhibbah"], ans: "B" },
      { q: "Kota Madinah sebelum kedatangan Nabi Muhammad saw. bernama...", options: ["A. Taif", "B. Yaśrib", "C. Makkah", "D. Khaibar"], ans: "B" }
    ];

    const snakesLadders = {
      4: 14, 9: 31, 20: 38, 28: 84, 40: 59, 51: 67, 63: 81, 71: 91,
      17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 99: 78
    };

    // Data 3 Pemain (Nama Default)
    let players = [
      { id: 1, name: "Pemain 1", tokenClass: "token-p1", emoji: "🐥", pos: 1, prevPos: 1, asked: 0, correct: 0 },
      { id: 2, name: "Pemain 2", tokenClass: "token-p2", emoji: "🦊", pos: 1, prevPos: 1, asked: 0, correct: 0 },
      { id: 3, name: "Pemain 3", tokenClass: "token-p3", emoji: "🐰", pos: 1, prevPos: 1, asked: 0, correct: 0 }
    ];

    let currentPlayerIndex = 0;
    let currentQuestion = null;

    function startGame() {
      // Ambil nama dari input
      const name1 = document.getElementById('input-p1').value.trim() || "Pemain 1";
      const name2 = document.getElementById('input-p2').value.trim() || "Pemain 2";
      const name3 = document.getElementById('input-p3').value.trim() || "Pemain 3";

      players[0].name = name1;
      players[1].name = name2;
      players[2].name = name3;

      // Update Label Papan Skor
      document.getElementById('label-p1').innerText = `🐥 ${name1}`;
      document.getElementById('label-p2').innerText = `🦊 ${name2}`;
      document.getElementById('label-p3').innerText = `🐰 ${name3}`;

      // Update Banner Giliran
      document.getElementById('turn-banner').innerText = `Giliran: ${players[0].name} 🐥`;

      // Tutup Pop-Up Input Nama
      document.getElementById('name-modal').style.display = 'none';

      createBoard();
    }

    function createBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const colors = ['cell-c1', 'cell-c2', 'cell-c3', 'cell-c4'];

      for (let r = 9; r >= 0; r--) {
        for (let c = 0; c < 10; c++) {
          let cellNum = (r % 2 === 1) ? (r * 10 + (10 - c)) : (r * 10 + (c + 1));
          const cell = document.createElement('div');
          cell.className = `cell ${colors[(cellNum - 1) % 4]}`;
          cell.id = `cell-${cellNum}`;
          cell.innerText = cellNum;

          if (snakesLadders[cellNum]) {
            cell.innerHTML += (snakesLadders[cellNum] > cellNum) ? '<br>🪜' : '<br>🐍';
          }
          board.appendChild(cell);
        }
      }
      renderPlayers();
    }

    function renderPlayers() {
      document.querySelectorAll('.player-tokens-container').forEach(e => e.remove());

      for (let cellNum = 1; cellNum <= 100; cellNum++) {
        const cell = document.getElementById(`cell-${cellNum}`);
        const occupants = players.filter(p => p.pos === cellNum);

        if (occupants.length > 0 && cell) {
          const container = document.createElement('div');
          container.className = 'player-tokens-container';

          occupants.forEach(p => {
            const token = document.createElement('div');
            token.className = `player-token ${p.tokenClass}`;
            token.innerText = p.emoji;
            container.appendChild(token);
          });

          cell.appendChild(container);
        }
      }

      players.forEach(p => {
        document.getElementById(`pos-p${p.id}`).innerText = p.pos;
        const score = p.asked > 0 ? Math.round((p.correct / p.asked) * 100) : 0;
        document.getElementById(`score-p${p.id}`).innerText = `${score}%`;
      });
    }

    function rollDice() {
      const p = players[currentPlayerIndex];
      const diceBox = document.getElementById('dice-box');

      let count = 0;
      const interval = setInterval(() => {
        diceBox.innerText = Math.floor(Math.random() * 6) + 1;
        count++;
        if (count > 8) {
          clearInterval(interval);
          const finalDice = Math.floor(Math.random() * 6) + 1;
          diceBox.innerText = finalDice;

          p.prevPos = p.pos;
          p.pos += finalDice;

          if (p.pos >= 100) {
            p.pos = 100;
            renderPlayers();
            alert(`🎉 HOREEE! ${p.name} BERHASIL MENANG DAN MENCAPAI KOTAK 100!`);
            return;
          }

          renderPlayers();
          document.getElementById('roll-btn').disabled = true;

          setTimeout(() => showQuestion(), 500);
        }
      }, 50);
    }

    function showQuestion() {
      const p = players[currentPlayerIndex];
      const randomIndex = Math.floor(Math.random() * questions.length);
      currentQuestion = questions[randomIndex];

      document.getElementById('modal-player-tag').innerText = `Tantangan untuk ${p.name}`;
      document.getElementById('question-text').innerText = currentQuestion.q;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentQuestion.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt.charAt(0));
        optionsContainer.appendChild(btn);
      });

      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(selectedOption) {
      const p = players[currentPlayerIndex];
      p.asked++;

      const isCorrect = (selectedOption === currentQuestion.ans);
      const feedback = document.getElementById('feedback');

      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      if (isCorrect) {
        p.correct++;
        feedback.className = 'fb-correct';
        feedback.innerText = `🌟 BENAR! ${p.name} melangkah aman.`;

        if (snakesLadders[p.pos]) {
          const target = snakesLadders[p.pos];
          feedback.innerText += (target > p.pos) ? ` 🪜 Naik Tangga ke Kotak ${target}!` : ` 🐍 Terkena Ular ke Kotak ${target}.`;
          p.pos = target;
        }
      } else {
        feedback.className = 'fb-wrong';
        feedback.innerText = `❌ SALAH! Kunci Jawaban: (${currentQuestion.ans}). ${p.name} Mundur ke Kotak ${p.prevPos}.`;
        p.pos = p.prevPos;
      }

      renderPlayers();
      feedback.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('quiz-modal').style.display = 'none';
      
      currentPlayerIndex = (currentPlayerIndex + 1) % 3;
      
      const banner = document.getElementById('turn-banner');
      const nextP = players[currentPlayerIndex];
      
      banner.className = `turn-card turn-p${nextP.id}`;
      banner.innerText = `Giliran: ${nextP.name} ${nextP.emoji}`;

      for (let i = 1; i <= 3; i++) {
        document.getElementById(`row-p${i}`).classList.remove('active-row');
      }
      document.getElementById(`row-p${nextP.id}`).classList.add('active-row');

      document.getElementById('roll-btn').disabled = false;
    }
  </script>
</body>
</html>
